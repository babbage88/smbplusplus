responses:
    AuthToken:
        description: Respose will return login result and the user info.
        headers:
            expiration:
                format: date-time
                type: string
            refreshToken:
                type: string
            token:
                type: string
    UserDao:
        description: Respose will return login result and the user info.
        headers:
            createdAt:
                format: date-time
                type: string
            email:
                type: string
            enabled:
                type: boolean
            isDeleted:
                type: boolean
            lastModified:
                format: date-time
                type: string
            role_ids: {}
            roles:
                items:
                    type: string
                type: array
            username:
                type: string
        schema:
            $ref: '#/definitions/UUIDs'
