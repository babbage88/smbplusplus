consumes:
    - application/json
produces:
    - application/json
schemes:
    - http
    - https
swagger: "2.0"
info:
    contact:
        email: test@trahan.dev
        name: Justin Trahan
    license:
        name: N/A
    termsOfService: there are no TOS at this moment, use at your own risk we take no responsibility
    title: smbplusplus API.
    version: v0.0.1
host: localhost:8995
paths:
    /create/user:
        post:
            operationId: idOfcreateUserEndpoint
            parameters:
                - in: body
                  name: body
                  schema:
                    $ref: '#/definitions/CreateNewUserRequest'
                  x-go-name: Body
            responses:
                "200":
                    $ref: '#/responses/UserDao'
            security:
                - bearer: []
            summary: Create a new user.
            tags:
                - createuser
    /health/db/{TYPE}:
        get:
            description: |-
                Supported check types for insert operations: "insert", "delete", "read".
                All other types default to a read health check.
            operationId: idOfdbHealthCheck
            parameters:
                - description: Type of DB HealthCheck
                  in: path
                  name: TYPE
                  required: true
                  type: string
            responses:
                "200":
                    description: DbHeathCheckResponse
                    schema:
                        $ref: '#/definitions/DbHeathCheckResponse'
            security:
                - bearer: []
            summary: |-
                Performs database health check and returns a respoonse.
                Determines the type of health check to perform based on the URL path parameter "type".
                If the check type corresponds to an insert/write operation, it executes an insert health check.
                Otherwise, it defaults to a read health check.
            tags:
                - dbHealthCheck
    /login:
        post:
            operationId: idOfloginEndpoint
            parameters:
                - in: body
                  name: body
                  schema:
                    $ref: '#/definitions/UserLoginRequest'
                  x-go-name: Body
            responses:
                "200":
                    $ref: '#/responses/AuthToken'
            summary: Login a user and return token.
            tags:
                - login
